<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Genesys Agentic Virtual Agent Demo</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #ffffff;
      color: #ffffff;
      text-align: center;
    }

    .agent-container {
      margin-top: 20px;
      padding: 20px;
      background: rgba(0,0,0,0.2);
      border-radius: 10px;
    }

    input, select, button {
      padding: 8px;
      margin-top: 5px;
      border-radius: 5px;
      border: none;
    }

    button {
      cursor: pointer;
      margin-top: 15px;
      background: #ffffff;
      color: #333;
      font-weight: bold;
    }
  </style>
</head>

<body>

<h1>Genesys Agentic Virtual Agent Demo</h1>

<div class="agent-container">

  <label for="languageSelect">Choose Language:</label><br>
  <select id="languageSelect">
    <option value="en-GB">English (UK)</option>
    <option value="fr-FR">Français (FR)</option>
    <option value="de-DE">Deutsch (DE)</option>
  </select>

  <br><br>

  <label for="webUserEmail">Enter Email Address:</label><br>
  <input type="email" id="webUserEmail" placeholder="Enter email" size="30">

  <br>

  <button onclick="submitForm()">Submit</button>

</div>

<script>
  (function (g, e, n, es, ys) {
    g['_genesysJs'] = e;
    g[e] = g[e] || function () {
      (g[e].q = g[e].q || []).push(arguments)
    };
    g[e].t = 1 * new Date();
    g[e].c = es;
    ys = document.createElement('script');
    ys.async = 1;
    ys.src = n;
    ys.charset = 'utf-8';
    document.head.appendChild(ys);
  })(window, 'Genesys', 'https://apps.mypurecloud.de/genesys-bootstrap/genesys.min.js', {
    environment: 'prod-euc1',
    deploymentId: '10ac891d-60dd-40fc-86d8-4c803d4c0754'
  });

  function submitForm() {
    const locale = document.getElementById("languageSelect").value;
    const email  = document.getElementById("webUserEmail").value;

    if (!email) {
      alert("Please enter a valid email address");
      return;
    }

    localStorage.setItem("selectedLocale", locale);
    localStorage.setItem("selectedEmail", email);

    Genesys("command", "Database.set", {
      messaging: {
        customAttributes: {
          locale: locale,
          webUserEmail: email
        }
      }
    });

    location.reload();
  }

  function initializeGenesys() {
    const locale = localStorage.getItem("selectedLocale") || "en-GB";
    const email  = localStorage.getItem("selectedEmail") || "";

    document.getElementById("languageSelect").value = locale;
    document.getElementById("webUserEmail").value = email;

    Genesys("command", "Database.set", {
      messaging: {
        customAttributes: {
          locale: locale,
          webUserEmail: email
        }
      }
    });
  }

  window.onload = initializeGenesys;
</script>

</body>
</html>
